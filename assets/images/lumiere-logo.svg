<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 219 80" width="219" height="80" role="img" aria-label="Lumiere">
  <!-- Icon: abstract glow/droplet mark -->
  <g fill="#c47668">
    <!-- outer glow rays -->
    <circle cx="40" cy="40" r="4" opacity="0.35"/>
    <circle cx="40" cy="14" r="3"/>
    <circle cx="40" cy="66" r="3"/>
    <circle cx="14" cy="40" r="3"/>
    <circle cx="66" cy="40" r="3"/>
    <circle cx="21.5" cy="21.5" r="2.4"/>
    <circle cx="58.5" cy="21.5" r="2.4"/>
    <circle cx="21.5" cy="58.5" r="2.4"/>
    <circle cx="58.5" cy="58.5" r="2.4"/>

    <!-- central droplet -->
    <path d="M40 22
             C 47 32, 54 40.5, 54 48.5
             C 54 57.6, 47.7 64, 40 64
             C 32.3 64, 26 57.6, 26 48.5
             C 26 40.5, 33 32, 40 22 Z"/>
  </g>

  <!-- Wordmark -->
  <!-- textLength pins the wordmark to an exact width, so the trimmed
       viewBox can't clip it if Georgia is unavailable and a wider
       fallback serif is substituted. -->
  <text x="90" y="50"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        letter-spacing="0.5"
        textLength="118"
        lengthAdjust="spacingAndGlyphs"
        fill="#c47668">Lumiere.</text>
</svg>

